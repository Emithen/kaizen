<!-- ! 의 완성 -->

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>카이젠 철학</title>
</head>

<body>
    <h1>카이젠 철학</h1>
    <p>아주 조금씩이지만 매일 꾸준히 이어나간다</p>
    <p>거대한 지루함을 인내해야 빼앗기지 않는 열매를 맺을 수 있다</p>

    <h2>! 의 완성</h2>
    <p>오늘로써 ! 의 구조를 완성하였다</p>
    <p>계속해서 반복하다보면 새겨지는 날이 올 것이다</p>
    <p>그런 날이 오면 비로소 생략해도 된다</p>
</body>

</html>
