<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="정말 하기 싫구나..">
  <title>카이젠 철학</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <h1>철학</h1>
    <p>하기 싫어도 해야지...</p>
    <p>열심히 한 날이 다음 날의 기준을 올려세우면 안 된다</p>
    <p>목표 추세를 기억하자</p>
  </header>

  <main>
    <section>
      <h2>지난 이야기</h2>
      <ul>
        <li>열심히 했다</li>
        <li><code>setState</code> 를 만들어봤다</li>
        <li>일반화 계획을 구상했다</li>
      </ul>
    </section>
    <section>
      <h2>이번 이야기</h2>
      <ul>
        <li>재현</li>
        <li>명명 다듬기</li>
        <li>점점 손에 익기 시작한다</li>
      </ul>
    </section>
    <section>
      <h2>다음 이야기</h2>
      <ul>
        <li>벌어진 일들 정리 (ex. input 데이터 참조, input UI 상태 초기화 등)</li>
        <li>빈 입력 통과 여부</li>
        <li>TDZ, const, var 에 대해 학습하기</li>
      </ul>
    </section>
    <section>
      <h2>자유 게시판</h2>
      <ul id="post-list"></ul>
      <input id="post-input" type="text">
      <button id="add-post-button">등록하기</button>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
